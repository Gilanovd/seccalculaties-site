# Bouwt de site met build.py en zet hem op GitHub Pages bij elke wijziging op main.
name: Website publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site bouwen
        env:
          # Leeg zodra seccalculaties.nl als eigen domein is gekoppeld.
          SITE_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
          # Testadres (github.io) niet laten indexeren; met eigen domein wel.
          SITE_NOINDEX: ${{ steps.pages.outputs.base_path != '' }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
